# Redireciona todo HTTP para HTTPS
server {
    listen 80;
    server_name ng-theme-template.avmsistemas.net;

    # Necessário para o Certbot (ACME challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS com SSL Let's Encrypt
server {
    listen 443 ssl;
    http2  on;
    server_name ng-theme-template.avmsistemas.net;

    # Certificados emitidos pelo Certbot
    ssl_certificate     /etc/letsencrypt/live/ng-theme-template.avmsistemas.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ng-theme-template.avmsistemas.net/privkey.pem;

    # Configurações de segurança SSL recomendadas
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS (6 meses)
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options    nosniff;
    add_header X-Frame-Options           SAMEORIGIN;

    root  /usr/share/nginx/html;
    index index.html;

    # Proxy reverso para o backend — /api passa para NestJS
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Angular SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
