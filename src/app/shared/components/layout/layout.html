<div class="app-shell">
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-mark">◈</span>
      <span class="brand-name">AppTemplate</span>
    </div>

    <nav class="topbar-nav">
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/settings" routerLinkActive="active">Configurações</a>
    </nav>

    <div class="topbar-actions">
      <app-theme-picker />

      <div class="user-menu">
        <span class="avatar">{{ authService.user()?.avatarInitials }}</span>
        <span class="user-name">{{ authService.user()?.name }}</span>
        <button class="logout-btn" (click)="logout()" title="Sair">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M7 3H4a1 1 0 00-1 1v12a1 1 0 001 1h3M13 7l3 3-3 3M16 10H8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <router-outlet />
  </main>
</div>
